[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "call-me-vera"
version = "0.1.0"
description = "Say \"Vera\" and it remembers — shared, append-only project memory for AI coding agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Verantyx" }]
keywords = ["mcp", "memory", "agent", "claude", "continuity", "append-only", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/Ag3497120/call-me-vera"
Repository = "https://github.com/Ag3497120/call-me-vera"

[project.optional-dependencies]
mcp = ["mcp[cli]"]
dev = ["pytest"]

[project.scripts]
vera = "vera.cli:main"

[tool.setuptools]
packages = ["vera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
